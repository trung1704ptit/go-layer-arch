openapi: 3.0.3
info:
  title: Go Layer API
  version: 1.0.0
  description: REST API for authentication, users, and posts. All endpoints are intended to be called by a trusted BFF using the X-API-Key header.
servers:
  - url: http://localhost:8000
    description: Local development
tags:
  - name: Health
  - name: Auth
  - name: Users
  - name: Posts
security:
  - ApiKeyAuth: []
paths:
  /api/healthchecker:
    get:
      tags:
        - Health
      summary: Check API health
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: API is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "401":
          $ref: "#/components/responses/InvalidAPIKey"

  /api/auth/register:
    post:
      tags:
        - Auth
      summary: Register a user
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignUpInput"
      responses:
        "201":
          description: User registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/InvalidAPIKey"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/auth/login:
    post:
      tags:
        - Auth
      summary: Sign in a user
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignInInput"
      responses:
        "200":
          description: Login successful
          headers:
            Set-Cookie:
              description: Sets access_token, refresh_token, and logged_in cookies.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/InvalidAPIKey"

  /api/auth/refresh:
    get:
      tags:
        - Auth
      summary: Refresh the access token
      security:
        - ApiKeyAuth: []
          RefreshTokenCookie: []
      responses:
        "200":
          description: Access token refreshed
          headers:
            Set-Cookie:
              description: Sets a refreshed access_token cookie.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          $ref: "#/components/responses/InvalidAPIKey"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/auth/logout:
    get:
      tags:
        - Auth
      summary: Log out the current user
      security:
        - ApiKeyAuth: []
          BearerAuth: []
        - ApiKeyAuth: []
          AccessTokenCookie: []
      responses:
        "200":
          description: Logout successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/users/me:
    get:
      tags:
        - Users
      summary: Get the current user
      security:
        - ApiKeyAuth: []
          BearerAuth: []
        - ApiKeyAuth: []
          AccessTokenCookie: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/posts/:
    get:
      tags:
        - Posts
      summary: List posts
      security:
        - ApiKeyAuth: []
          BearerAuth: []
        - ApiKeyAuth: []
          AccessTokenCookie: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: string
            default: "1"
        - name: limit
          in: query
          required: false
          schema:
            type: string
            default: "10"
      responses:
        "200":
          description: Posts returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags:
        - Posts
      summary: Create a post
      security:
        - ApiKeyAuth: []
          BearerAuth: []
        - ApiKeyAuth: []
          AccessTokenCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePostRequest"
      responses:
        "201":
          description: Post created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/posts/{postId}:
    get:
      tags:
        - Posts
      summary: Get a post by ID
      security:
        - ApiKeyAuth: []
          BearerAuth: []
        - ApiKeyAuth: []
          AccessTokenCookie: []
      parameters:
        - $ref: "#/components/parameters/PostID"
      responses:
        "200":
          description: Post returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags:
        - Posts
      summary: Update a post
      security:
        - ApiKeyAuth: []
          BearerAuth: []
        - ApiKeyAuth: []
          AccessTokenCookie: []
      parameters:
        - $ref: "#/components/parameters/PostID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePostRequest"
      responses:
        "200":
          description: Post updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags:
        - Posts
      summary: Delete a post
      security:
        - ApiKeyAuth: []
          BearerAuth: []
        - ApiKeyAuth: []
          AccessTokenCookie: []
      parameters:
        - $ref: "#/components/parameters/PostID"
      responses:
        "200":
          description: Post deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletePostResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: Server-to-server key used by the BFF when calling the Go backend.
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: User access token accepted by DeserializeUser.
    AccessTokenCookie:
      type: apiKey
      in: cookie
      name: access_token
      description: User access token cookie accepted by DeserializeUser.
    RefreshTokenCookie:
      type: apiKey
      in: cookie
      name: refresh_token
      description: Refresh token cookie used by the refresh endpoint.

  parameters:
    PostID:
      name: postId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Resource conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InvalidAPIKey:
      description: Missing or invalid API key
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIKeyErrorResponse"
    Unauthorized:
      description: Missing or invalid API key or user access token
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/APIKeyErrorResponse"
              - $ref: "#/components/schemas/AuthErrorResponse"
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    HealthResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            message:
              type: string
              example: Welcome to Golang with Gorm and Postgres

    MessageResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            message:
              type: string
              example: logout successful

    LoginResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            access_token:
              type: string

    DeletePostResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            deleted:
              type: boolean
              example: true

    UserEnvelope:
      type: object
      properties:
        data:
          type: object
          properties:
            user:
              $ref: "#/components/schemas/User"

    PostEnvelope:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/Post"

    PostListResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            results:
              type: integer
              example: 1
            posts:
              type: array
              items:
                $ref: "#/components/schemas/Post"

    ErrorResponse:
      type: object
      properties:
        error:
          type: string

    APIKeyErrorResponse:
      type: object
      properties:
        status:
          type: string
          example: fail
        message:
          type: string
          example: invalid api key

    AuthErrorResponse:
      type: object
      properties:
        status:
          type: string
          example: fail
        message:
          type: string
          example: You are not logged in

    SignUpInput:
      type: object
      required:
        - name
        - email
        - role
        - password
        - passwordConfirm
        - photo
      properties:
        name:
          type: string
          example: Jane Doe
        email:
          type: string
          format: email
          example: jane@example.com
        role:
          type: string
          example: user
        password:
          type: string
          minLength: 8
          format: password
          example: password123
        passwordConfirm:
          type: string
          format: password
          example: password123
        photo:
          type: string
          example: default.png

    SignInInput:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: jane@example.com
        password:
          type: string
          format: password
          example: password123

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
        photo:
          type: string
        provider:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Post:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        content:
          type: string
        image:
          type: string
        user:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreatePostRequest:
      type: object
      required:
        - title
        - content
        - image
      properties:
        title:
          type: string
          example: First post
        content:
          type: string
          example: Post content
        image:
          type: string
          example: https://example.com/image.png

    UpdatePostRequest:
      type: object
      properties:
        title:
          type: string
          example: Updated post
        content:
          type: string
          example: Updated content
        image:
          type: string
          example: https://example.com/updated.png
